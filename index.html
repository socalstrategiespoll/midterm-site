<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2026 Midterm Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --sand:#EFE6D6; --sand2:#E6DAC4; --paper:#F7F1E4; --ink:#1D1A16; --ink2:#5A5247; --line:#CFC2A8;
  --crimson:#9C2A22; --ember:#D2691E; --flare:#F2A541;
  --R:#B03A2E; --D:#2B5C8F; --mid:#E9E1CE;
  --serif:'Newsreader',Georgia,serif; --sans:'Manrope',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){
  :root{--sand:#1A1713; --sand2:#24201A; --paper:#211D17; --ink:#F1E9D8; --ink2:#B3A890; --line:#3B342A; --mid:#2E2920; --R:#D8584A; --D:#5B8FC7}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--sand);color:var(--ink);font:15px/1.5 var(--sans)}
a{color:inherit}
:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header.top{border-bottom:2px solid var(--ink);padding:22px 0 14px}
header.top .wrap{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font:600 clamp(30px,5vw,48px)/1 var(--serif);letter-spacing:-.02em;margin:0}
h1 em{font-style:italic;font-weight:400;color:var(--crimson)}
.meta{font:12px/1.4 var(--mono);color:var(--ink2);text-align:right}
.status{display:inline-flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);display:inline-block}
.dot.live{background:var(--ember)}
.controls{display:flex;flex-wrap:wrap;gap:16px 28px;padding:14px 0;align-items:center;border-bottom:1px solid var(--line)}
.seg{display:inline-flex;border:1px solid var(--ink);border-radius:3px;overflow:hidden}
.seg button{font:600 13px var(--sans);background:transparent;color:var(--ink);border:0;padding:7px 12px;cursor:pointer;border-right:1px solid var(--ink)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--sand)}
.clabel{font:12px var(--mono);color:var(--ink2);margin-right:8px}
.legend{margin-left:auto;display:flex;align-items:center;gap:8px;font:11px var(--mono);color:var(--ink2)}
.legend i{display:block;width:150px;height:10px;border-radius:2px;background:linear-gradient(90deg,var(--D),var(--mid),var(--R))}
section.grp{padding:22px 0 6px}
section.grp h2{font:600 24px var(--serif);margin:0 0 10px;display:flex;align-items:baseline;gap:10px}
section.grp h2 small{font:12px var(--mono);color:var(--ink2);font-weight:400}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px}
.tile{display:block;text-decoration:none;border:1px solid rgba(0,0,0,.18);border-radius:3px;padding:8px 9px 7px;min-height:84px;position:relative;color:#1D1A16;transition:transform .12s}
.tile:hover{transform:translateY(-2px)}
.tile .l{font:700 15px var(--sans);display:block}
.tile .m{font:500 19px var(--mono);display:block;margin-top:2px;letter-spacing:-.02em}
.tile .w{font:11px var(--mono);display:block;opacity:.8;margin-top:2px}
.tile.dark{color:#fff}
.tile .flag{position:absolute;right:6px;top:6px;width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.55}
.tile .flag.wide{border-radius:0}
.note{font:12px/1.5 var(--mono);color:var(--ink2);padding:18px 0 40px;max-width:780px}
/* detail */
.back{display:inline-block;margin:18px 0 6px;font:600 13px var(--sans);text-decoration:none;border-bottom:1px solid var(--ink)}
.dh{display:flex;flex-wrap:wrap;gap:6px 24px;align-items:baseline;justify-content:space-between;padding:4px 0 12px}
.dh h2{font:600 clamp(34px,6vw,56px)/1 var(--serif);margin:0;letter-spacing:-.02em}
.dh .sub{font:14px var(--sans);color:var(--ink2)}
.big{font:500 clamp(30px,5vw,44px)/1 var(--mono);letter-spacing:-.03em}
.big small{display:block;font:12px var(--mono);color:var(--ink2);letter-spacing:0;margin-top:4px}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;border:1px solid var(--ink);border-radius:3px;margin:8px 0 20px;background:var(--paper)}
.bk{padding:12px 14px;border-right:1px solid var(--line)}
.bk:last-child{border-right:0}
.bk .n{font:12px var(--mono);color:var(--ink2)}
.bk .v{font:500 26px var(--mono);letter-spacing:-.03em}
.bk .s{font:12px var(--mono);color:var(--ink2)}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}
.bar b{display:block;height:100%;background:var(--ink)}
.grid2{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:24px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}.legend{margin-left:0}.meta{text-align:left}}
.card{background:var(--paper);border:1px solid var(--line);border-radius:3px;padding:14px 16px;margin-bottom:16px}
.card h3{font:600 19px var(--serif);margin:0 0 8px}
#map{width:100%;height:auto;display:block}
#map path{stroke:var(--paper);stroke-width:.7px;vector-effect:non-scaling-stroke}
#map path:hover{stroke:var(--ink);stroke-width:1.6px}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--sand);font:12px/1.4 var(--mono);padding:6px 8px;border-radius:3px;z-index:9;display:none;max-width:240px}
table{border-collapse:collapse;width:100%;font:13px var(--mono)}
th,td{padding:5px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font:600 12px var(--sans);color:var(--ink2);cursor:pointer;user-select:none;position:sticky;top:0;background:var(--paper)}
.tscroll{max-height:460px;overflow:auto}
.pos-R{color:var(--R)} .pos-D{color:var(--D)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font:13px var(--mono)}
.kv dt{color:var(--ink2)} .kv dd{margin:0;text-align:right}
.live-box{border:1px dashed var(--ember);border-radius:3px;padding:12px 14px;font:13px/1.5 var(--mono);color:var(--ink2)}
.mapsel{margin:0 0 8px}
.ticker{background:var(--ink);color:var(--sand);overflow:hidden;white-space:nowrap;border-bottom:1px solid var(--line);font:12px/1 var(--mono);height:34px;display:none;align-items:center;position:relative}
.ticker.on{display:flex}
.ticker .lbl{flex:none;padding:0 12px;height:100%;display:flex;align-items:center;background:var(--crimson);color:#fff;font-weight:500;z-index:1}
.ticker .rail{overflow:hidden;flex:1;height:100%}
.ticker .track{display:inline-flex;height:100%;align-items:center;animation:tk 90s linear infinite;will-change:transform}
.ticker:hover .track{animation-play-state:paused}
.ticker a{display:inline-flex;gap:8px;align-items:baseline;padding:0 18px;text-decoration:none;border-right:1px solid rgba(255,255,255,.18)}
.ticker .px{font-weight:500}.ticker .up{color:#7FD99A}.ticker .dn{color:#FF8F82}.ticker .mdl{opacity:.6}
@keyframes tk{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.ticker .track{animation:none}.ticker .rail{overflow-x:auto}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <h1>2026 Midterm <em>Board</em></h1>
  <div class="meta"><div id="gen"></div><div class="status"><span class="dot" id="dot"></span><span id="feed">Live feed not connected</span></div></div>
</div></header>
<div class="ticker" id="ticker" aria-label="Live Kalshi prices"><span class="lbl">Kalshi</span><div class="rail"><div class="track" id="tk"></div></div></div>
<main class="wrap" id="app"></main>
<div class="tip" id="tip"></div>

<script>
window.ENGINE_URL='https://midterm-model.onrender.com';/* set to https://YOUR-SERVICE.onrender.com after deploying the engine */

(function(){
'use strict';
var DATA=null, GEO=null, GEOIDX={}, LIVE=null, KAL=null;
var state={type:'All',view:'final',sort:'margin'};
var app=document.getElementById('app'), tip=document.getElementById('tip');

function fmtM(m){ if(m==null||isNaN(m))return '–'; if(Math.abs(m)<0.05)return 'EVEN'; return (m>0?'R+':'D+')+Math.abs(m).toFixed(1);}
function cls(m){return m>0?'pos-R':'pos-D';}
// diverging color: margin in points, saturate by ±20
function mix(a,b,t){return a.map(function(x,i){return Math.round(x+(b[i]-x)*t);});}
var cR=[176,58,46], cD=[43,92,143], cM=[233,225,206];
function color(m){
  if(m==null||isNaN(m))return {bg:'#cfc6b2',dark:false};
  var t=Math.min(1,Math.abs(m)/20); t=Math.pow(t,.8);
  var c=mix(cM,m>0?cR:cD,t);
  var lum=(0.299*c[0]+0.587*c[1]+0.114*c[2]);
  return {bg:'rgb('+c.join(',')+')',dark:lum<140};
}
function cMargin(c){var t=c[2]+c[3];return t?(c[3]-c[2])/t*100:0;}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

function mw(r){var l=LIVE&&LIVE.races&&LIVE.races[r.id];return l&&l.win_prob!=null?l.win_prob:null;}

function kq(r){return KAL&&KAL.prices&&KAL.prices[r.id]||null;}
function kfmt(v){return v==null?'–':(Math.round(v*10)/10)+'\u00a2';}
function kchg(q){var c=q&&q.change;if(c==null||c===0)return '';return '<span class="'+(c>0?'up':'dn')+'">'+(c>0?'\u25b2':'\u25bc')+Math.abs(c).toFixed(1)+'</span>';}
function renderTicker(){
  var el=document.getElementById('ticker'),tk=document.getElementById('tk');
  if(!el||!DATA)return;
  var items=DATA.races.filter(function(r){var q=kq(r);return q&&q.mid!=null;});
  if(!items.length){el.className='ticker';return;}
  items.sort(function(a,b){return Math.abs(kq(b).change||0)-Math.abs(kq(a).change||0)||a.label.localeCompare(b.label);});
  var one=items.map(function(r){var q=kq(r),m=mw(r);
    return '<a href="#/race/'+r.id+'"><b>'+esc(r.label)+'</b><span class="px">R '+kfmt(q.mid)+'</span>'+kchg(q)+(m!=null?'<span class="mdl">model '+Math.round(m*100)+'%</span>':'')+'</a>';}).join('');
  tk.innerHTML=one+one;el.className='ticker on';
}
function refreshKalshi(){
  if(!window.ENGINE_URL)return;
  fetch(window.ENGINE_URL+'/api/kalshi',{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;})
    .then(function(k){if(!k||!k.prices)return;KAL=k;renderTicker();if(/^#\/race\//.test(location.hash))updateRaceKalshi();});
}
function updateRaceKalshi(){
  var m=location.hash.match(/^#\/race\/(.+)$/);if(!m)return;
  var r=DATA.races.filter(function(x){return x.id===decodeURIComponent(m[1]);})[0],q=r&&kq(r),el=document.getElementById('kalshiBox');
  if(el&&q)el.innerHTML=kalshiRows(r);
}
function kalshiRows(r){
  var q=kq(r),w=mw(r);
  if(!q)return '<dt>Kalshi (R)</dt><dd>–</dd>';
  var d=(w!=null&&q.mid!=null)?(w*100-q.mid):null;
  return '<dt>Kalshi R price</dt><dd>'+kfmt(q.mid)+' '+kchg(q)+'</dd><dt>Bid / ask / last</dt><dd>'+kfmt(q.bid)+' / '+kfmt(q.ask)+' / '+kfmt(q.last)+'</dd>'+
    (d!=null?'<dt>Model minus Kalshi</dt><dd>'+(d>0?'+':'')+d.toFixed(1)+' pts</dd>':'');
}
function raceView(r){
  // value for current board view
  var bm=r.bucket_margins||{};
  if(state.view==='final')return r.headline;
  if(state.view==='early'){
    if(bm.early!=null)return bm.early;
    if(bm.mail!=null&&bm.eip!=null){var s=r.shares;return (bm.mail*s.mail+bm.eip*s.eip)/(s.mail+s.eip);}
    if(bm.em!=null&&bm.lm!=null){var s2=r.shares;return (bm.em*s2.em+bm.lm*s2.lm)/(s2.em+s2.lm);}
    if(bm.mail!=null)return bm.mail;
    return null;
  }
  if(state.view==='ed'){ return bm.ed!=null?bm.ed:null; }
  return r.margin;
}

function renderBoard(){
  var races=DATA.races.filter(function(r){return state.type==='All'||r.type===state.type;});
  var groups=[['Senate','Senate'],['Governor','Governor'],['House','House']];
  var h='';
  h+='<div class="controls"><div><span class="clabel">Show</span><span class="seg" id="segType">'+
     ['All','Senate','Governor','House'].map(function(t){return '<button aria-pressed="'+(state.type===t)+'" data-t="'+t+'">'+t+'</button>';}).join('')+'</span></div>'+
     '<div><span class="clabel">Margin</span><span class="seg" id="segView">'+
     [['final','Final'],['early','Early vote'],['ed','Election Day']].map(function(v){return '<button aria-pressed="'+(state.view===v[0])+'" data-v="'+v[0]+'">'+v[1]+'</button>';}).join('')+'</span></div>'+
     '<div class="legend">D+20<i></i>R+20</div></div>';
  groups.forEach(function(g){
    var rs=races.filter(function(r){return r.type===g[0];});
    if(!rs.length)return;
    rs.sort(function(a,b){
      var av=raceView(a),bv=raceView(b);
      if(av==null)av=-999; if(bv==null)bv=-999;
      return state.sort==='margin'?bv-av:a.label.localeCompare(b.label);
    });
    h+='<section class="grp"><h2>'+g[1]+'<small>'+rs.length+' races, sorted most Republican to most Democratic</small></h2><div class="tiles">';
    rs.forEach(function(r){
      var v=raceView(r),c=color(v),k=r.kalshi||{};
      var w=k.vh_win!=null?(k.vh_win>=50?(k.prev==='R'||true?'':''):''):'';
      var rw=k.vh_win; // baseline win prob
      h+='<a class="tile'+(c.dark?' dark':'')+'" style="background:'+c.bg+'" href="#/race/'+r.id+'">'+
         '<span class="l">'+esc(r.label)+'</span><span class="m">'+(v==null?'n/a':fmtM(v))+'</span>'+
         '<span class="w">'+(mw(r)!=null?'Model '+Math.round(mw(r)*100)+'%':'')+'</span></a>';
    });
    h+='</div></section>';
  });
  h+='<p class="note">Tile color is the projected two-party margin (R minus D) from our county-level projections. Early-vote and Election Day views come from our models; races reported by town or township, and all-mail races, have no split and show n/a in those views. The percentage on each tile is the model probability that the Republican wins. The model starts from our pre-election margin and updates from county results on election night.</p>';
  app.innerHTML=h;
  document.getElementById('segType').onclick=function(e){var t=e.target.getAttribute('data-t');if(t){state.type=t;renderBoard();}};
  document.getElementById('segView').onclick=function(e){var t=e.target.getAttribute('data-v');if(t){state.view=t;renderBoard();}};
}

/* ---------- map ---------- */
function project(lonlat,p){ // Albers equal-area conic
  var d=Math.PI/180, lon=lonlat[0]*d, lat=lonlat[1]*d;
  var rho=Math.sqrt(p.C-2*p.n*Math.sin(lat))/p.n;
  var th=p.n*(lon-p.l0);
  return [1000*rho*Math.sin(th),1000*(p.r0-rho*Math.cos(th))];
}
function mkProj(bb){
  var d=Math.PI/180;
  var p1=(bb[1]+(bb[3]-bb[1])/6)*d, p2=(bb[3]-(bb[3]-bb[1])/6)*d;
  var n=(Math.sin(p1)+Math.sin(p2))/2;
  var C=Math.cos(p1)*Math.cos(p1)+2*n*Math.sin(p1);
  var l0=((bb[0]+bb[2])/2)*d, lat0=((bb[1]+bb[3])/2)*d;
  var p={n:n,C:C,l0:l0};
  p.r0=Math.sqrt(C-2*n*Math.sin(lat0))/n;
  return p;
}
function rings(g){return g.type==='Polygon'?[g.coordinates]:g.coordinates;}
function drawMap(r,which){
  var rows=r.counties, feats=[], det=null, wy=null;
  rows.forEach(function(c){if(c[0]==='2622000')det=c;if(c[0]==='26163')wy=c;});
  rows.forEach(function(c){
    if(c===det)return;                                   // Detroit has no county shape: it is drawn inside Wayne
    var row=c;
    if(c===wy&&det){row=[c[0],'Wayne (incl. Detroit)',c[2]+det[2],c[3]+det[3]];   // Wayne's shape shows Detroit and the rest combined
      var w1=c[2]+c[3],w2=det[2]+det[3];
      for(var j=4;j<c.length;j++){row[j]=(c[j]!=null&&det[j]!=null)?(c[j]*w1+det[j]*w2)/(w1+w2):null;}}
    var f=GEOIDX[c[0]];if(f)feats.push({f:f,row:row});});
  if(!feats.length){document.getElementById('mapbox').innerHTML='<p class="note">No county shapes for this race.</p>';return;}
  var bb=[999,999,-999,-999];
  feats.forEach(function(x){rings(x.f.geometry).forEach(function(poly){poly.forEach(function(ring){ring.forEach(function(pt){
    if(pt[0]<bb[0])bb[0]=pt[0];if(pt[1]<bb[1])bb[1]=pt[1];if(pt[0]>bb[2])bb[2]=pt[0];if(pt[1]>bb[3])bb[3]=pt[1];});});});});
  var p=mkProj(bb), mnx=1e9,mny=1e9,mxx=-1e9,mxy=-1e9, paths=[];
  feats.forEach(function(x){
    var d='';
    rings(x.f.geometry).forEach(function(poly){poly.forEach(function(ring){
      ring.forEach(function(pt,i){var q=project(pt,p);
        if(q[0]<mnx)mnx=q[0];if(q[0]>mxx)mxx=q[0];if(q[1]<mny)mny=q[1];if(q[1]>mxy)mxy=q[1];
        d+=(i?'L':'M')+q[0].toFixed(2)+' '+(-q[1]).toFixed(2);});
      d+='Z';});});
    paths.push(d);
  });
  var w=mxx-mnx,h=mxy-mny,pad=Math.max(w,h)*.02;
  var bi=r.buckets.map(function(b){return b.key;});
  var svg='<svg id="map" viewBox="'+(mnx-pad)+' '+(-mxy-pad)+' '+(w+2*pad)+' '+(h+2*pad)+'" role="img" aria-label="County map for '+esc(r.label)+'">';
  feats.forEach(function(x,i){
    var m;
    if(which==='final')m=cMargin(x.row);
    else{var j=bi.indexOf(which);m=j>=0?x.row[4+j]:null;}
    svg+='<path d="'+paths[i]+'" fill="'+color(m).bg+'" data-i="'+i+'" data-m="'+(m==null?'':m)+'"/>';
  });
  svg+='</svg>';
  var box=document.getElementById('mapbox'); box.innerHTML=svg;
  var el=document.getElementById('map');
  el.addEventListener('mousemove',function(e){
    var t=e.target; if(t.tagName!=='path'){tip.style.display='none';return;}
    var x=feats[+t.getAttribute('data-i')].row, m=t.getAttribute('data-m');
    tip.innerHTML='<b>'+esc(x[1])+'</b><br>'+(m===''?'':fmtM(+m))+'<br>'+(x[2]+x[3]).toLocaleString()+' votes';
    tip.style.display='block';tip.style.left=Math.min(window.innerWidth-250,e.clientX+14)+'px';tip.style.top=(e.clientY+14)+'px';
  });
  el.addEventListener('mouseleave',function(){tip.style.display='none';});
}

/* ---------- detail ---------- */
function renderRace(id){
  var r=DATA.races.filter(function(x){return x.id===id;})[0];
  if(!r){location.hash='';return;}
  var k=r.kalshi||{}, bm=r.bucket_margins||{}, sh=r.shares||{};
  var h='<a class="back" href="#/">All races</a>';
  h+='<div class="dh"><div><h2>'+esc(r.label)+'</h2><div class="sub">'+esc(r.type)+' &middot; '+esc(r.rep)+' vs '+esc(r.other)+'</div></div>'+
     '<div class="big '+cls(r.headline)+'">'+fmtM(r.headline)+'<small>Projection &middot; county sum '+fmtM(r.margin)+'</small></div></div>';
  if(r.buckets.length){
    h+='<div class="buckets">'+r.buckets.map(function(b){
      var s=sh[b.key],m=bm[b.key];
      return '<div class="bk"><div class="n">'+esc(b.label)+'</div><div class="v '+(m==null?'':cls(m))+'">'+fmtM(m)+'</div><div class="s">'+(s==null?'':(s*100).toFixed(1)+'% of vote')+'</div><div class="bar"><b style="width:'+((s||0)*100)+'%"></b></div></div>';
    }).join('')+'</div>';
  }
  h+='<div class="grid2"><div>'+
     '<div class="card"><h3>Counties</h3><div class="mapsel"><span class="seg" id="segMap">'+
       '<button aria-pressed="true" data-w="final">Final</button>'+
       r.buckets.map(function(b){return '<button aria-pressed="false" data-w="'+b.key+'">'+esc(b.label)+'</button>';}).join('')+
     '</span></div><div id="mapbox"></div></div>'+
     '<div class="card"><h3>County projections</h3><div class="tscroll"><table id="ct"></table></div></div>'+
     '</div><div>'+
     '<div class="card"><h3>Win probability</h3><dl class="kv">'+
       '<dt>Win probability (R)</dt><dd>'+(mw(r)!=null?(mw(r)*100).toFixed(1)+'%':'–')+'</dd>'+
       '<dt>Model 90% range</dt><dd>'+(LIVE&&LIVE.races&&LIVE.races[r.id]?fmtM(LIVE.races[r.id].p05)+' to '+fmtM(LIVE.races[r.id].p95):'–')+'</dd>'+
       '<span id="kalshiBox" style="display:contents">'+kalshiRows(r)+'</span>'+
       '<dt>Held by</dt><dd>'+esc(k.prev||'–')+'</dd>'+
       '<dt>Total projected votes</dt><dd>'+(r.votes||0).toLocaleString()+'</dd>'+
     '</dl></div>'+

     '<div class="card"><h3>Election night</h3><div class="live-box" id="livebox">Live feed not connected. Once the engine is running, the projected final margin, reporting progress and win probability appear here.</div></div>'+
     '</div></div>';
  app.innerHTML=h;
  drawMap(r,'final');
  document.getElementById('segMap').onclick=function(e){
    var w=e.target.getAttribute('data-w');if(!w)return;
    [].forEach.call(this.children,function(b){b.setAttribute('aria-pressed',b===e.target);});
    drawMap(r,w);
  };
  buildTable(r);
  if(LIVE&&LIVE.races&&LIVE.races[id])renderLive(LIVE.races[id]);
}
function buildTable(r){
  var sortKey=3,asc=false;
  var heads=['County','Votes','Final'].concat(r.buckets.map(function(b){return b.label;}));
  function rowsSorted(){
    var rows=r.counties.slice();
    var val=function(c){return sortKey===0?c[1]:sortKey===1?c[2]+c[3]:sortKey===2?cMargin(c):c[4+sortKey-3];};
    rows.sort(function(a,b){var x=val(a),y=val(b);if(typeof x==='string')return asc?x.localeCompare(y):y.localeCompare(x);return asc?x-y:y-x;});
    return rows;
  }
  function draw(){
    var t=document.getElementById('ct');
    var h='<thead><tr>'+heads.map(function(x,i){return '<th data-i="'+i+'">'+esc(x)+'</th>';}).join('')+'</tr></thead><tbody>';
    rowsSorted().forEach(function(c){
      h+='<tr><td>'+esc(c[1])+'</td><td>'+(c[2]+c[3]).toLocaleString()+'</td><td class="'+cls(cMargin(c))+'">'+fmtM(cMargin(c))+'</td>'+
        r.buckets.map(function(b,j){var m=c[4+j];return '<td class="'+(m==null?'':cls(m))+'">'+fmtM(m)+'</td>';}).join('')+'</tr>';
    });
    t.innerHTML=h+'</tbody>';
    t.querySelector('thead').onclick=function(e){var i=e.target.getAttribute('data-i');if(i==null)return;i=+i;if(i===sortKey)asc=!asc;else{sortKey=i;asc=(i===0);}draw();};
  }
  sortKey=1;asc=false;draw();
}
function renderLive(L){
  var b=document.getElementById('livebox'); if(!b)return;
  if(L.state==='pre'){b.innerHTML='Pre-election forecast. Counted votes appear here once results start coming in.';return;}
  b.style.borderStyle='solid';
  b.innerHTML='<b>'+esc(L.status||'Live')+'</b><br>Projected margin '+fmtM(L.margin)+' &middot; 90% range '+fmtM(L.p05)+' to '+fmtM(L.p95)+' &middot; R win probability '+(L.win_prob*100).toFixed(1)+'%'+(L.reporting!=null?' &middot; about '+(L.reporting*100).toFixed(0)+'% of expected votes counted':'')+(L.call_ready?'<br>Model says this race is decided. Calls are made by hand.':'');
}
function route(){
  window.scrollTo(0,0);
  var m=location.hash.match(/^#\/race\/(.+)$/);
  if(m)renderRace(decodeURIComponent(m[1])); else renderBoard();
}
window.addEventListener('hashchange',route);

function load(){
  Promise.all([
    fetch('data.json').then(function(r){return r.json();}),
    fetch('counties.geojson').then(function(r){return r.json();}),
    fetch((window.ENGINE_URL?window.ENGINE_URL+'/api/projection':'projection.json'),{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;})
  ]).then(function(a){
    DATA=a[0];GEO=a[1];LIVE=a[2];
    GEO.features.forEach(function(f){GEOIDX[f.id||(f.properties&&f.properties.f)]=f;});
    document.getElementById('gen').textContent='Projections as of '+DATA.generated;
    if(LIVE){var lv=LIVE.mode==='live';document.getElementById('dot').className='dot'+(lv?' live':'');document.getElementById('feed').textContent=(lv?'Live results ':'Model forecast ')+(LIVE.updated||'');}
    route();renderTicker();refreshKalshi();
  }).catch(function(e){
    app.innerHTML='<p class="note">Could not load data.json and counties.geojson. Serve this folder over HTTP (for example, deploy it to Cloudflare Pages) instead of opening the file directly.</p>';
  });
}
function refreshLive(){
  fetch((window.ENGINE_URL?window.ENGINE_URL+'/api/projection':'projection.json'),{cache:'no-store'})
    .then(function(r){return r.ok?r.json():null;}).catch(function(){return null;})
    .then(function(p){
      if(!p||!DATA||(LIVE&&p.updated===LIVE.updated))return;
      LIVE=p;var lv=p.mode==='live';
      document.getElementById('dot').className='dot'+(lv?' live':'');
      document.getElementById('feed').textContent=(lv?'Live results ':'Model forecast ')+(p.updated||'');
      route();
    });
}
setInterval(refreshLive,30000);
setInterval(refreshKalshi,15000);
load();
})();
</script>
</body>
</html>
